<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalimba Tab PDFs</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="header-content">
            <a href="https://nov05.github.io/kalimba/" class="logo-link" title="Home">
                <img src="assets\20260805_logo_kalimba_200_200.png" class="logo" alt="logo kalimba">
            </a>
            <div class="header-text">
                <h1>Kalimba Tabs</h1>
                <p>Free Kalimba Number Notation PDFs</p>
            </div>
        </div>
    </header>
    <div class="container">
        <input id="search" placeholder="Search songs..." />
        <div id="tags">
            <button onclick="showAll()">
                All
            </button>
            <button onclick="filterTag('17-key')">
                17-key
            </button>
            <button onclick="filterTag('21-key')">
                21-key
            </button>
        </div>
        <h2 id="title">
            All Tabs
        </h2>
        <div id="songs"></div>
    </div>
    <script src="app.js"></script>
</body>

<footer>
    <div class="footer-github">
        <a href="https://github.com/nov05/kalimba/tree/main/pdf" target="_blank" title="Browse all PDFs on GitHub">
            <img src="assets/20260805_logo_github.png" class="footer-logo" alt="GitHub logo">
        </a>
        <a href="https://github.com/nov05" target="_blank" class="github-handle" title="Visit @nov05 on GitHub">
            @nov05
        </a>
    </div>
</footer>

</html>
