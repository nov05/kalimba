<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalimba Tabs PDF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Kalimba Tabs</h1>
        <p>Free Kalimba Sheet Music PDF</p>
    </header>
    <div class="container">
        <input id="search" placeholder="Search songs..." />
        <div id="tags">
            <button onclick="filterTag('21-key')">
                21-key
            </button>
            <button onclick="filterTag('17-key')">
                17-key
            </button>
            <button onclick="showAll()">
                All
            </button>
        </div>
        <h2 id="title">
            All Tabs
        </h2>
        <div id="songs"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
